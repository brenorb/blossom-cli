name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/*.tar.gz

  binary-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            executable: blossom-cli
          - os: macos-15-intel
            platform: macos-x86_64
            executable: blossom-cli
          - os: macos-14
            platform: macos-arm64
            executable: blossom-cli
          - os: windows-latest
            platform: windows-x86_64
            executable: blossom-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify upstream version
        run: uv run python scripts/check_upstream_version.py
      - name: Build upstream binary
        run: |
          rust_version="$(uv run python scripts/check_upstream_version.py --print-local-version)"
          cargo install blossom-cli --version "$rust_version" --locked --root "$RUNNER_TEMP/blossom"
        shell: bash
      - name: Bundle upstream binary
        run: |
          mkdir -p "src/blossom_cli/bin/${{ matrix.platform }}"
          cp "$RUNNER_TEMP/blossom/bin/${{ matrix.executable }}" \
            "src/blossom_cli/bin/${{ matrix.platform }}/${{ matrix.executable }}"
          chmod +x "src/blossom_cli/bin/${{ matrix.platform }}/${{ matrix.executable }}"
        shell: bash
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl

  publish:
    needs: [source, binary-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
